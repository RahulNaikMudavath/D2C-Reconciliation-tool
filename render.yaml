services:
  - type: web
    name: reconcilex
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reconcilex-db
          property: connectionString

databases:
  - name: reconcilex-db
    plan: free
    region: oregon
    databaseName: reconcilex
    user: reconcilex_user

